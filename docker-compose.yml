# Local dev/test Postgres with pgvector.
# The app connects as the NON-SUPERUSER role `pcos_app` so Row-Level Security is
# genuinely enforced (superusers/owners bypass RLS). Migrations use the
# superuser via MIGRATE_DATABASE_URL.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pcos-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcos
    ports:
      - "5432:5432"
    volumes:
      - pcos-pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pcos"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pcos-pgdata:
